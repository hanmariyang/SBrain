name: Release

on:
  push:
    tags:
      - 'v*'

env:
  APP_NAME: SBrain
  SCHEME: SBrain
  PROJECT_DIR: app

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Extract version from tag
      - name: Get version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"

      # 3. Install Developer ID certificate
      - name: Install certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db

          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      # 4. Install XcodeGen
      - name: Install XcodeGen
        run: brew install xcodegen

      # 5. Generate Xcode project
      - name: Generate project
        working-directory: ${{ env.PROJECT_DIR }}
        run: xcodegen generate

      # 6. Resolve SPM dependencies
      - name: Resolve dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ${{ env.APP_NAME }}.xcodeproj \
            -scheme ${{ env.SCHEME }}

      # 7. Archive
      - name: Archive
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          xcodebuild archive \
            -project ${{ env.APP_NAME }}.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -configuration Release \
            -archivePath ../build/${{ env.APP_NAME }}.xcarchive \
            CODE_SIGN_IDENTITY="Developer ID Application: gicheol yang (94C6X7LGU7)" \
            DEVELOPMENT_TEAM=94C6X7LGU7 \
            CODE_SIGN_STYLE=Manual \
            ENABLE_HARDENED_RUNTIME=YES \
            MARKETING_VERSION=${{ env.VERSION }}

      # 8. Export .app via xcodebuild
      - name: Export app
        run: |
          cat > /tmp/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>94C6X7LGU7</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "build/${{ env.APP_NAME }}.xcarchive" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath build/export

          cp -R "build/export/${{ env.APP_NAME }}.app" "build/${{ env.APP_NAME }}.app"

      # 9. Verify signature
      - name: Verify signature
        run: |
          echo "=== Code signature ==="
          codesign --verify --deep --strict --verbose=2 "build/${{ env.APP_NAME }}.app"
          echo "=== Signing info ==="
          codesign -dvv "build/${{ env.APP_NAME }}.app" 2>&1 || true

      # 10. Notarize
      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent "build/${{ env.APP_NAME }}.app" "build/${{ env.APP_NAME }}.zip"

          # Submit for notarization and capture submission ID
          SUBMIT_OUTPUT=$(xcrun notarytool submit "build/${{ env.APP_NAME }}.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait 2>&1) || true

          echo "$SUBMIT_OUTPUT"

          # Extract submission ID
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep "id:" | head -1 | awk '{print $2}')

          # Check status
          if echo "$SUBMIT_OUTPUT" | grep -q "status: Invalid"; then
            echo "=== Notarization FAILED — Downloading detailed log ==="
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              /tmp/notarization-log.json 2>&1 || true
            cat /tmp/notarization-log.json
            exit 1
          fi

          echo "=== Notarization succeeded — Stapling ==="
          xcrun stapler staple "build/${{ env.APP_NAME }}.app"

      # 11. Create DMG
      - name: Create DMG
        run: |
          brew install create-dmg

          create-dmg \
            --volname "${{ env.APP_NAME }}" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "${{ env.APP_NAME }}.app" 150 190 \
            --app-drop-link 450 190 \
            --no-internet-enable \
            "build/${{ env.APP_NAME }}-${{ env.VERSION }}.dmg" \
            "build/${{ env.APP_NAME }}.app"

      # 12. Update Sparkle appcast
      - name: Generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Remove notarization zip to avoid duplicate version error
          rm -f "build/${{ env.APP_NAME }}.zip"

          SPARKLE_BIN=$(find ~/Library/Developer/Xcode/DerivedData -name "generate_appcast" -path "*/sparkle/*" | head -1)

          if [ -z "$SPARKLE_BIN" ]; then
            echo "Sparkle generate_appcast not found, downloading..."
            curl -L -o /tmp/sparkle.tar.xz "https://github.com/sparkle-project/Sparkle/releases/latest/download/Sparkle-2.6.0.tar.xz"
            mkdir -p /tmp/sparkle && tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle
            SPARKLE_BIN="/tmp/sparkle/bin/generate_appcast"
          fi

          echo "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle_key
          "$SPARKLE_BIN" --ed-key-file /tmp/sparkle_key \
            --download-url-prefix "https://github.com/hanmariyang/SBrain/releases/download/v${{ env.VERSION }}/" \
            build/
          rm -f /tmp/sparkle_key

          cp build/appcast.xml appcast.xml

      # 13. Commit updated appcast
      - name: Commit appcast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git add appcast.xml
          git diff --cached --quiet || git commit -m "chore: update appcast.xml for v${{ env.VERSION }}"
          git push origin main

      # 14. Create GitHub Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/${{ env.APP_NAME }}-${{ env.VERSION }}.dmg
          generate_release_notes: true
          name: "SBrain v${{ env.VERSION }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
