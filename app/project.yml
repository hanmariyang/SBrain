name: SBrain
options:
  bundleIdPrefix: com.hanmari.sbrain
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.2.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  SBrain:
    type: application
    platform: macOS
    sources:
      - SBrain
    dependencies:
      - package: SwiftTerm
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hanmari.sbrain
        MARKETING_VERSION: "0.8.0"
        CURRENT_PROJECT_VERSION: 6
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_ENTITLEMENTS: SBrain/SBrain.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: SBrain/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: "public.app-category.productivity"
        NSCameraUsageDescription: "손 제스처 인식을 위해 카메라를 사용합니다"
        SUFeedURL: "https://raw.githubusercontent.com/hanmariyang/SBrain/main/appcast.xml"
        SUPublicEDKey: "5VaUBojjyv4R8Uzu2tzIQULe7Eo9sHKgOf4ZsgqB3Ug="
        SUScheduledCheckInterval: 3600
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
    entitlements:
      path: SBrain/SBrain.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
