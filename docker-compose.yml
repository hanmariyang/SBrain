services:
  # Django backend
  backend:
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sbrain-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    env_file:
      - ./backend/.env
    environment:
      PORT: "8765"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/api/status/')"]
      interval: 10s
      timeout: 5s
      retries: 5
